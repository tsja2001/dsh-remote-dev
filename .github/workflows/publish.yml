name: publish

on:
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: npm with provenance
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use a trusted-publishing capable npm
        run: npm install --global npm@latest

      - name: Require release tag to match package version
        run: |
          package_version="$(node --print "require('./packages/remote-ssh/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Start disposable SSH server
        run: |
          ssh-keygen -q -t ed25519 -N '' -f /tmp/dsh-ci-key
          docker run -d --name dsh-sshd-test -p 2222:2222 \
            -e PUID=1000 -e PGID=1000 -e TZ=UTC -e SUDO_ACCESS=true \
            -e USER_NAME=dev -e USER_PASSWORD=test1234 -e PASSWORD_ACCESS=true \
            -e "PUBLIC_KEY=$(cat /tmp/dsh-ci-key.pub)" \
            linuxserver/openssh-server
          for i in $(seq 1 20); do
            if ssh-keyscan -T 2 -p 2222 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          echo "sshd handshake not ready after 60 seconds"
          exit 1

      - name: Test and inspect package
        run: npm run release:check
        env:
          DSH_TEST_KEY: /tmp/dsh-ci-key

      - name: Publish public package with provenance
        working-directory: packages/remote-ssh
        run: npm publish --access public --provenance

      - name: Remove disposable SSH server
        if: always()
        run: docker rm -f dsh-sshd-test 2>/dev/null || true
